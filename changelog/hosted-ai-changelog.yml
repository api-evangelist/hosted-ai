- version: 2.4.1
  surface: Admin Panel API
  breaking: true
  highlights:
  - 20 new endpoints (546 registered routes / 550 documented Swagger operations, up from 526 / 499).
  - 51 new DTO definitions.
  - 'Breaking: rootfs_persistence_capable removed from node-level DTOs; now read from pool objects.'
  - GPUaaS Floating IP management (5 endpoints — create/list/update/delete floating-IP mappings).
  - KVM high-availability control (4 endpoints — enable/disable HA, status, force-remove cluster node).
  - Marketplace pod operations (4 endpoints — RootFS status, factory reset, reconciliation inventory).
  - Sync & storage features (7 endpoints — pod/team sync, storage availability, recipe execution logs).
  - '~38 pre-existing 2.4.0 KVM node-management routes newly documented in Swagger.'
  - 'Deprecation: plaintext marketplace token linking marked legacy; OAuth authorize flow recommended.'
