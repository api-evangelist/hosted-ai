name: Hosted·ai
description: >-
  Hosted·ai is a San Jose, California software company (founded 2024, public
  launch early 2025) providing a turnkey neocloud / GPU-as-a-Service (GPUaaS)
  platform that lets service providers, telcos and hosts turn NVIDIA GPU fleets
  into high-margin, multi-tenant AI cloud infrastructure. The platform delivers
  software-defined GPU orchestration (multi-tenant pooling, adaptive scheduling,
  GPU overcommit 2x-10x), monetization and neocloud operations (billing,
  metering, user management, white-label self-service panels), and a GPU Mesh
  wholesale capacity network. It exposes a full REST API across an Admin Panel
  API (GPUaaS infrastructure: pools, nodes, GPU/NPU discovery, high
  availability, floating IPs) and a User Panel API, documented at docs.hosted.ai
  and Swagger-generated, with bearer API-token authentication, IP allowlisting,
  and prebuilt integrations for WHMCS, HubSpot and Stripe.
