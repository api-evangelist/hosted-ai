apis:
- name: Hosted·ai Platform API
  description: >-
    REST API for the Hosted·ai neocloud platform, split into an Admin Panel API
    (GPUaaS infrastructure: GPU pools, nodes, GPU/NPU hardware discovery, high
    availability, floating IPs, regions) and a User Panel API (workspaces,
    account settings, API tokens, billing). Swagger-documented (546 registered
    routes / 550 operations as of Admin Panel 2.4.1). The API is served per
    white-label deployment at the pattern base URL below; authentication is a
    bearer API token created in the User Panel with optional IP allowlisting.
  humanURL: https://docs.hosted.ai/
  baseURL: https://USER_PANEL_URL/api
